<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>라멘 콜라보 응모</title>
</head>
<body>
<h1>🍜 라멘 콜라보 선착순 응모</h1>

<!-- 이미 등록된 번호 등 서비스 에러 메시지 -->
<div th:if="${errorMessage}" style="color: red; font-weight: bold; margin-bottom: 10px;">
  <p th:text="${errorMessage}"></p>
</div>

<form action="#" th:action="@{/apply}" th:object="${collabEntity}" method="post">
  <div>
    <label for="name">이름:</label>
    <input type="text" id="name" th:field="*{name}" placeholder="이름을 입력하세요">
    <!-- 이름 검증 에러 메시지 -->
    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: red; font-size: 14px;"></p>
  </div>
  <br>
  <div>
    <label for="phone">전화번호:</label>
    <input type="text" id="phone" th:field="*{phone}" placeholder="010-0000-0000">
    <!-- 전화번호 검증 에러 메시지 -->
    <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" style="color: red; font-size: 14px;"></p>
  </div>
  <br>
  <div>
    <label for="mail">메일주소:</label>
    <input type="text" id="mail" th:field="*{mail}" placeholder="메일주소를 입력하세요">
    <!-- 전화번호 검증 에러 메시지 -->
    <p th:if="${#fields.hasErrors('mail')}" th:errors="*{mail}" style="color: red; font-size: 14px;"></p>
  </div>
  <br>
  <button type="submit">응모하기</button>
</form>
</body>
</html>
